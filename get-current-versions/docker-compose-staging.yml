services:
  version-scraper:
    image: thales-version-scraper:${VERSION:-latest}
    container_name: thales-version-scraper
    environment:
      # Controls when the daily midnight scan runs.
      TZ: America/New_York
    restart: unless-stopped
    networks:
      - proxy_network
    labels:
      # TRAEFIK - staging (cargo.apoapsis.xyz)
      - traefik.enable=true
      - traefik.docker.network=proxy_network
      - traefik.http.routers.ver.rule=Host(`ver.apoapsis.xyz`)
      - traefik.http.routers.ver.entrypoints=websecure
      - traefik.http.services.ver.loadbalancer.server.port=80
      - traefik.http.routers.ver.tls=true
networks:
  proxy_network:
    external: true
